
# Concurrency only applies to push-triggered runs on development branches.
# workflow_dispatch runs get a unique group (run_id) so multiple manual
# triggers can execute in parallel — which is the whole point of load testing.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('load-tests-dispatch-{0}', github.run_id) || format('load-tests-{0}', github.ref) }}
  cancel-in-progress: false

on:
  push:
    branches:
      - development/**
  workflow_dispatch:
    inputs:
      environment:
        type: environment
        default: production

name: test-load

jobs:
  load-test:
    strategy:
      fail-fast: false
      matrix:
        test:
        # 10 github-hosted workers to generate concurrent upload load
        - {host: ubuntu-latest, name: github-hosted-1}
        - {host: ubuntu-latest, name: github-hosted-2}
        - {host: ubuntu-latest, name: github-hosted-3}
        - {host: ubuntu-latest, name: github-hosted-4}
        - {host: ubuntu-latest, name: github-hosted-5}
        - {host: ubuntu-latest, name: github-hosted-6}
        - {host: ubuntu-latest, name: github-hosted-7}
        - {host: ubuntu-latest, name: github-hosted-8}
        - {host: ubuntu-latest, name: github-hosted-9}
        - {host: ubuntu-latest, name: github-hosted-10}
        # keep one self-hosted for comparison
        - {host: [self-hosted, focal, large], name: self-hosted}
    runs-on: ${{ matrix.test.host }}
    environment: ${{ inputs.environment || 'production' }}
    name: load tests on ${{ matrix.test.name }}
    steps:
      - uses: actions/checkout@v6
      - name: create multiple files
        run: |
          mkdir -p artifacts/${{ matrix.test.name }}
          for i in {1..20}; do
            head -c 1G /dev/urandom > artifacts/${{ matrix.test.name }}/$i.txt
          done
        shell: bash
      - name: Push all files
        uses: ./
        with:
          url: ${{ vars.ARTIFACTS_URL }}
          user: ${{ secrets.ARTIFACTS_USER }}
          password: ${{ secrets.ARTIFACTS_PASSWORD }}
          source: ./artifacts
          method: upload
